<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>PasteDrop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a1a1a;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a2a;
            transition: padding 0.3s ease;
        }

        .drop-zone {
            border: 2px dashed #3a3a3a;
            border-radius: 12px;
            padding: 80px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #121212;
            position: relative;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .drop-zone:hover {
            border-color: #6c5ce7;
            background: #181818;
        }

        .drop-zone .key-hint {
            display: inline-block;
            background: #2a2a2a;
            padding: 6px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .drop-zone .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 48px;
            color: #6c5ce7;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .drop-zone .status.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .drop-zone .status.hide {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
        }

        .drop-zone .status-text {
            margin-top: 8px;
            font-size: 13px;
            color: #6c5ce7;
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .drop-zone .status-text.show {
            opacity: 1;
        }

        .drop-zone .status-text.hide {
            opacity: 0;
        }

        .drop-zone .content-wrapper {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .drop-zone .content-wrapper.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        #pasteArea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 10;
            cursor: pointer;
        }

        .footer-text {
            color: #333;
            font-size: 11px;
            margin-top: 16px;
            letter-spacing: 0.3px;
            transition: opacity 0.3s ease;
        }

        .footer-text.hidden {
            opacity: 0;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
            .drop-zone {
                padding: 50px 16px;
                min-height: 180px;
            }
            .drop-zone .status {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="drop-zone" id="dropZone">
        <div class="content-wrapper" id="contentWrapper">
            <div class="key-hint">Ctrl + V</div>
        </div>

        <div class="status" id="statusIcon">✓</div>
        <div class="status-text" id="statusText">сохранено</div>

        <div id="pasteArea" contenteditable="true"></div>
    </div>
    <div class="footer-text" id="footerText">вставьте изображение</div>
</div>

<script>
    (function() {
        const pasteArea = document.getElementById('pasteArea');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const contentWrapper = document.getElementById('contentWrapper');
        const footerText = document.getElementById('footerText');
        const dropZone = document.getElementById('dropZone');

        let timeoutId = null;

        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showSuccess() {
            // Скрываем основной контент
            contentWrapper.classList.add('hidden');
            footerText.classList.add('hidden');

            // Показываем статус с анимацией
            statusIcon.classList.remove('hide', 'show');
            statusText.classList.remove('hide', 'show');

            // Небольшая задержка для сброса анимации
            void statusIcon.offsetWidth;

            statusIcon.classList.add('show');
            statusText.classList.add('show');

            // Автоматически скрываем через 1.5 секунды
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                hideSuccess();
            }, 1500);
        }

        function hideSuccess() {
            statusIcon.classList.remove('show');
            statusIcon.classList.add('hide');
            statusText.classList.remove('show');
            statusText.classList.add('hide');

            setTimeout(() => {
                statusIcon.classList.remove('hide');
                statusText.classList.remove('hide');
                contentWrapper.classList.remove('hidden');
                footerText.classList.remove('hidden');
                pasteArea.innerHTML = '';
            }, 400);
        }

        function processImage(blob) {
            if (!blob || !blob.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const ext = blob.type.split('/')[1] || 'png';
                const filename = `image_${Date.now()}.${ext}`;
                downloadImage(e.target.result, filename);
                showSuccess();
            };
            reader.readAsDataURL(blob);
        }

        function handlePaste(e) {
            const items = e.clipboardData ? e.clipboardData.items : [];
            let found = false;

            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    if (blob) {
                        processImage(blob);
                        found = true;
                        break;
                    }
                }
            }

            if (!found) {
                const html = e.clipboardData?.getData('text/html');
                if (html) {
                    const imgMatch = html.match(/<img[^>]+src="([^"]+)"/i);
                    if (imgMatch && imgMatch[1]) {
                        const url = imgMatch[1];
                        fetch(url)
                            .then(res => res.blob())
                            .then(blob => {
                                if (blob.type.startsWith('image/')) {
                                    processImage(blob);
                                    found = true;
                                }
                            })
                            .catch(() => {});
                    }
                }
            }

            setTimeout(() => {
                if (!found) {
                    pasteArea.innerHTML = '';
                }
            }, 100);

            e.preventDefault();
        }

        // Вставка через Ctrl+V
        document.addEventListener('paste', function(e) {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') {
                return;
            }
            handlePaste(e);
        });

        pasteArea.addEventListener('paste', handlePaste);

        pasteArea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
            }
        });

        // Перетаскивание
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#6c5ce7';
        });

        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#3a3a3a';
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#3a3a3a';

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                processImage(files[0]);
            }
        });

        console.log('⌘ Готово. Нажмите Ctrl+V.');
    })();
</script>

</body>
</html>
